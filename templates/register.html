{%extends "base.html"%}
{%block content%}

<div class="auth-wrapper">
    <div class="auth-card">

        <a href="{{ url_for('landing_html') }}" class="btn-secondary-home">
            ← Terug naar home
        </a><br>

        <div class="auth-logo">
            <div class="logo-icon"></div>
            <h1>StuddyBuddy</h1>
        </div>

        <h2>registreer</h2>




        <form method="POST">
            <div class="input-group">
                <span class="input-icon"></span>
                <input type="text" name="username" placeholder="Gebruikersnaam" required>
            </div>
            <div class="input-group">
                <span class="input-icon"></span>
                <input type="password" name="password" placeholder="Wachtwoord" required>
            </div>
            <button type="submit" class="btn-primary">Account aanmaken</button>
        </form>

        <p class="auth-link">Al een account? <a href="{{ url_for('login') }}">Login hier</a></p>
    </div>
</div>

{% endblock %}
