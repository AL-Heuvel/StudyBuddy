<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBuddy - Advertentie</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
    <!-- PWA & Favicons -->
     <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
     <meta name="theme-color" content="#d4b8e0">
     <meta name="apple-mobile-web-app-capable" content="yes">
     <meta name="apple-mobile-web-app-title" content="StudyBuddy">
     <link rel="apple-touch-icon" href="{{ url_for('static', filename='media/apple-touch-icon.png') }}">
     <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='media/favicon-32x32.png') }}">
     <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='media/favicon-16x16.png') }}">
     <link rel="icon" href="{{ url_for('static', filename='media/favicon.ico') }}">
</head>
<body class="popup-body">
    <div class="advertentie-overlay">
        <div class="advertentie-modal">
            <a class="advertentie-sluiten" href="{{ target }}" aria-label="Sluiten">×</a>
            <div class="advertentie-modal-label">Advertentie</div>
            <img class="advertentie-modal-afbeelding" src="{{ url_for('static', filename='advertensies/' + advertentie['afbeelding']) }}" alt="{{ advertentie['titel'] }}">
            <p class="advertentie-modal-tekst">Deze advertentie is goedgekeurd en wordt nu zichtbaar op StudyBuddy.</p>
        </div>
    </div>
</body>
</html>
